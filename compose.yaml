name: okam-local-bridge
services:
  init:
    image: okam-local-bridge:local
    build: .
    user: "0:0"
    entrypoint: ["python", "/app/scripts/bootstrap.py"]
    volumes:
      - gateway:/run/bridge
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"
  bridge:
    stop_grace_period: 45s
    image: okam-local-bridge:local
    build: .
    network_mode: host
    command: ["api", "--listen", "127.0.0.1", "--port", "${BRIDGE_PORT:-8098}", "--access-token-file", "/run/bridge/gateway-token"]
    environment:
      BRIDGE_HEALTH_PORT: "${BRIDGE_PORT:-8098}"
      BRIDGE_RTSP_INTERNAL_URL: "rtsp://127.0.0.1:${RTSP_PORT:-8554}"
      BRIDGE_RTSP_PORT: "${RTSP_PORT:-8554}"
      BRIDGE_ONVIF_PORT: "${ONVIF_PORT:-8899}"
      BRIDGE_RECORDINGS_DIR: /recordings
      BRIDGE_STATE_DIR: /state
      BRIDGE_ONVIF_LISTEN: "${ONVIF_LISTEN:-0.0.0.0}"
    volumes:
      - gateway:/run/bridge:ro
      - recordings:/recordings
      - state:/state
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['BRIDGE_HEALTH_PORT']+'/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: ./web
    network_mode: host
    environment:
      WEB_LISTEN: "${WEB_LISTEN:-0.0.0.0}"
      WEB_PORT: "${WEB_PORT:-8080}"
      BRIDGE_PORT: "${BRIDGE_PORT:-8098}"
    volumes:
      - gateway:/run/bridge:ro
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${WEB_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    network_mode: host
    environment:
      MTX_AUTHHTTPADDRESS: "http://127.0.0.1:${BRIDGE_PORT:-8098}/api/exports/auth"
      MTX_RTSPADDRESS: "${RTSP_LISTEN:-0.0.0.0}:${RTSP_PORT:-8554}"
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      bridge:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  gateway:
  recordings:
  state:
