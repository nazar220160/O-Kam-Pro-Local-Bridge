name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "import json; from openapi_spec_validator import validate_spec; validate_spec(json.load(open('docs/openapi.json')))"
      - run: node tests/controls_ui_race.test.cjs && node tests/frontend_native.test.cjs && node tests/frontend_assets.test.cjs && node tests/frontend_exports.test.cjs && node tests/frontend_archive.test.cjs
      - run: docker compose config --quiet
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://127.0.0.1:8080/health && curl --fail http://127.0.0.1:8080/openapi.json > /dev/null
      - if: always()
        run: docker compose down
